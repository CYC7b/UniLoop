events {
    worker_connections 1024;
}

http {
    # Docker 内置 DNS，启动时不立即解析上游，避免依赖顺序问题
    resolver 127.0.0.11 valid=10s;

    # nginx 是最外层入口：X-Forwarded-For 一律覆盖为真实对端地址，而不是追加，
    # 客户端自带的 X-Forwarded-For 不会传到后端，限流也就无法被伪造 IP 绕过。
    # 若前面还有一层负载均衡，改用 real_ip 模块（set_real_ip_from）先还原客户端 IP。

    server {
        listen 8080;
        server_name _;

        # Auth 微服务
        location /api/auth/ {
            set $auth http://auth-service:8081;
            proxy_pass $auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # WebSocket — 必须在 / 之前匹配
        location /ws {
            set $core http://core-service:8082;
            proxy_pass $core;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 3600s;
        }

        # 所有其他请求 → Core 服务
        location / {
            set $core http://core-service:8082;
            proxy_pass $core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
            client_max_body_size 200m;
        }
    }
}
